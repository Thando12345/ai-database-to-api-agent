<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERD to API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center">ERD → API Generator</h1>
        
        <!-- Single Upload Area -->
        <div class="bg-white p-6 rounded-lg shadow mb-4">
            <div class="border-2 border-dashed border-gray-300 p-8 text-center rounded cursor-pointer hover:border-blue-400" onclick="document.getElementById('file').click()">
                <input type="file" id="file" accept="image/*" class="hidden" onchange="process()">
                <p class="text-gray-600">Drop ERD image or click to upload</p>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="bg-white p-6 rounded-lg shadow hidden">
            <h3 class="font-bold mb-4">Generated API</h3>
            <pre id="code" class="bg-gray-100 p-4 rounded text-sm overflow-x-auto"></pre>
            <button onclick="download()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Download API Code
            </button>
        </div>
    </div>

    <script>
        async function process() {
            const file = document.getElementById('file').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('images', file);

            try {
                const response = await fetch('/api/schema/upload-image', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const apiCode = generateAPI(result.analysis);
                    document.getElementById('code').textContent = apiCode;
                    document.getElementById('results').classList.remove('hidden');
                }
            } catch (error) {
                alert('Processing failed');
            }
        }

        function generateAPI(analysis) {
            return `const express = require('express');
const app = express();
app.use(express.json());

// Generated endpoints
app.get('/api/users', (req, res) => res.json([]));
app.post('/api/users', (req, res) => res.json({id: 1, ...req.body}));

app.listen(3000, () => console.log('API running on port 3000'));`;
        }

        function download() {
            const code = document.getElementById('code').textContent;
            const blob = new Blob([code], {type: 'text/javascript'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'api.js';
            a.click();
        }
    </script>
</body>
</html>
